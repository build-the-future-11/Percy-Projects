name: R24 engineering tests
on:
  pull_request:
    paths:
      - 'research/r24_20261020/**'
      - '.github/workflows/r24-unit-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact source revision
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install engineering test dependencies
        run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Syntax validation
        run: python -m compileall -q research/r24_20261020
      - name: Mathematical and engineering unit tests only
        working-directory: research/r24_20261020
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: python -m unittest discover -v
      - name: Verify scientific execution cannot silently fall back to CPU
        working-directory: research/r24_20261020
        run: |
          set +e
          python run_development.py --projects 01 --seeds 0 --output /tmp/r24-blocked-preflight
          code=$?
          set -e
          test "$code" -eq 1
          python -c "import json; m=json.load(open('/tmp/r24-blocked-preflight/manifest.json')); assert m['status']=='BLOCKED'"
